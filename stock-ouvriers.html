<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>StockPro — Gestion des stocks</title>
<meta name="theme-color" content="#0f1117"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0f1117;
  --surface:  #181c27;
  --surface2: #1e2332;
  --surface3: #252a3a;
  --border:   #2e3449;
  --border2:  #3a4060;
  --accent:   #4f7fff;
  --accent2:  #3d6ef0;
  --green:    #22c55e;
  --yellow:   #f59e0b;
  --red:      #ef4444;
  --purple:   #a855f7;
  --text:     #e8ecf4;
  --text2:    #8b92a9;
  --text3:    #5a6278;
  --radius:   14px;
  --radius-sm:8px;
  --shadow:   0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 8px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ════════════════════════════════
   LOGIN
════════════════════════════════ */
#screen-login {
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(79,127,255,.12) 0%, transparent 70%),
              var(--bg);
  padding:20px;
}
.login-wrap{width:100%;max-width:380px;}
.login-brand{text-align:center;margin-bottom:32px;}
.login-logo-ring{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,var(--accent),#7b5ea7);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin:0 auto 16px;
  box-shadow:0 0 40px rgba(79,127,255,.3);
}
.login-brand h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;}
.login-brand span{color:var(--accent);}
.login-brand p{color:var(--text2);font-size:.875rem;margin-top:4px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:var(--shadow-lg);}
.lbl{display:block;font-size:.78rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.sel-user{
  width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:1rem;font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:border-color .2s;margin-bottom:20px;
}
.sel-user:focus{outline:none;border-color:var(--accent);}
.sel-user option{background:var(--surface2);}
.pin-label{font-size:.78rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:block;}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:20px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .15s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(79,127,255,.5);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.pk{
  padding:18px 10px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:1.25rem;font-weight:600;
  font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s;
}
.pk:hover{background:var(--surface3);border-color:var(--border2);}
.pk:active{transform:scale(.95);}
.pk.del{color:var(--red);border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.06);}
.pk.del:hover{background:rgba(239,68,68,.12);}
.pin-err{min-height:18px;font-size:.8rem;color:var(--red);font-weight:500;text-align:center;margin-bottom:12px;}
.btn-connect{
  width:100%;padding:15px;border:none;border-radius:var(--radius-sm);cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:1rem;font-weight:700;font-family:'DM Sans',sans-serif;
  transition:opacity .2s,transform .15s;letter-spacing:.02em;
}
.btn-connect:hover{opacity:.9;}
.btn-connect:active{transform:scale(.98);}

/* ════════════════════════════════
   LAYOUT APP
════════════════════════════════ */
#screen-app{display:none;min-height:100vh;flex-direction:column;}

/* TOPBAR */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7b5ea7);display:flex;align-items:center;justify-content:center;font-size:16px;}
.topbar-title{font-weight:700;font-size:1rem;letter-spacing:-.3px;}
.topbar-user{font-size:.78rem;color:var(--text2);font-weight:500;}
.badge-admin{display:inline-flex;align-items:center;gap:4px;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:20px;padding:2px 8px;font-size:.7rem;font-weight:700;}
.btn-logout{padding:7px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:transparent;color:var(--text2);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

/* SYNC STATUS */
.sync-status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.75rem;color:var(--text3);font-weight:500;
  padding:4px 10px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);
}
.sync-status.synced{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.1);}
.sync-status svg{width:12px;height:12px;}

/* NAV */
.nav{
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;padding:0 16px;gap:2px;overflow-x:auto;
}
.nav-btn{
  padding:14px 16px;border:none;background:transparent;color:var(--text2);
  font-size:.83rem;font-weight:600;cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;transition:all .2s;
  font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;
}
.nav-btn svg{width:15px;height:15px;flex-shrink:0;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.nav-badge{background:var(--red);color:#fff;border-radius:20px;padding:1px 6px;font-size:.65rem;font-weight:700;}

/* CONTENT */
.content{padding:20px;max-width:860px;margin:0 auto;width:100%;}
.tab{display:none;}
.tab.active{display:block;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
.card-title{font-size:.95rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.card-title svg{width:18px;height:18px;color:var(--accent);}

/* FORMS */
.field-label{display:block;font-size:.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.field-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:.93rem;font-family:'DM Sans',sans-serif;
  transition:border-color .2s;margin-bottom:0;
}
.field-input:focus{outline:none;border-color:var(--accent);background:var(--surface3);}
.field-input::placeholder{color:var(--text3);}
.field-input option{background:var(--surface2);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.field-wrap{margin-bottom:14px;}

/* PRODUCT BLOCKS */
.prod-block{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:10px;position:relative;transition:border-color .2s;
}
.prod-block.has-error{border-color:var(--red);}
.prod-block-inner{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;}
.prod-select-wrap{position:relative;}
.prod-search{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  background:var(--surface3);color:var(--text);font-size:.88rem;font-family:'DM Sans',sans-serif;
}
.prod-search:focus{outline:none;border-color:var(--accent);}
.prod-search::placeholder{color:var(--text3);}
.prod-select{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-top:none;
  border-radius:0 0 var(--radius-sm) var(--radius-sm);
  background:var(--surface3);color:var(--text);font-size:.88rem;font-family:'DM Sans',sans-serif;
}
.prod-select:focus{outline:none;border-color:var(--accent);}
.prod-select option{background:var(--surface2);}
.qte-wrap{width:110px;}
.qte-input{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface3);color:var(--text);font-size:1rem;font-weight:600;
  font-family:'DM Mono',monospace;text-align:center;
}
.qte-input:focus{outline:none;border-color:var(--accent);}
.qte-label{font-size:.7rem;color:var(--text3);text-align:center;margin-top:4px;font-weight:500;}
.rm-btn{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:6px;border:none;background:rgba(239,68,68,.1);color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s;}
.rm-btn:hover{background:rgba(239,68,68,.2);}
.stock-pill{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:700;
  border:1.5px solid;background:rgba(0,0,0,.2);
}
.stock-pill.ok{color:var(--green);border-color:rgba(34,197,94,.4);}
.stock-pill.low{color:var(--yellow);border-color:rgba(245,158,11,.4);}
.stock-pill.crit{color:var(--red);border-color:rgba(239,68,68,.4);}
.stock-pill.zero{color:var(--text3);border-color:var(--border2);}

/* BUTTONS */
.btn-primary{
  width:100%;padding:14px 18px;border:none;border-radius:var(--radius-sm);cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:.95rem;font-weight:700;font-family:'DM Sans',sans-serif;
  transition:opacity .2s,transform .15s;letter-spacing:.02em;
}
.btn-primary:hover{opacity:.9;}
.btn-primary:active{transform:scale(.98);}
.btn-secondary{
  width:100%;padding:13px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;background:transparent;color:var(--text);font-size:.9rem;font-weight:600;
  font-family:'DM Sans',sans-serif;transition:all .2s;
}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-add{
  width:100%;padding:11px 16px;border:1.5px dashed var(--border);border-radius:var(--radius-sm);
  background:transparent;color:var(--text2);font-size:.85rem;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-add:hover{border-color:var(--accent);color:var(--accent);}
.btn-add svg{width:16px;height:16px;}

/* TABLE STOCKS */
.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px;}
.stock-table{width:100%;border-collapse:separate;border-spacing:0 6px;}
.stock-table thead th{
  font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.08em;padding:0 12px 10px;text-align:left;
}
.stock-table tbody tr{
  background:var(--surface2);transition:background .15s;cursor:pointer;
}
.stock-table tbody tr:hover{background:var(--surface3);}
.stock-table tbody td{
  padding:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.stock-table tbody td:first-child{border-left:1px solid var(--border);border-radius:var(--radius-sm) 0 0 var(--radius-sm);}
.stock-table tbody td:last-child{border-right:1px solid var(--border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.stock-table .nom-col{font-weight:600;font-size:.9rem;}
.stock-table .qte-col{font-family:'DM Mono',monospace;font-weight:700;font-size:.95rem;}
.stock-table .status-col{text-align:center;}

/* HISTORIQUE */
.hist-grid{display:grid;gap:10px;}
.hist-card{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;transition:border-color .15s;position:relative;overflow:hidden;
}
.hist-card::before{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:var(--purple);
}
.hist-card.type-achat::before{background:var(--green);}
.hist-card.type-divers::before{background:var(--yellow);}
.hist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.hist-type{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;
  font-weight:700;text-transform:uppercase;letter-spacing:.05em;
}
.hist-type.util{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3);}
.hist-type.achat{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.hist-type.divers{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3);}
.hist-date{font-size:.78rem;color:var(--text3);font-weight:600;font-family:'DM Mono',monospace;}
.hist-info{margin-bottom:10px;}
.hist-row{display:flex;gap:8px;font-size:.85rem;color:var(--text2);margin-bottom:4px;}
.hist-row strong{color:var(--text);font-weight:600;}
.hist-produits{margin-bottom:8px;}
.hist-produits-title{font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:6px;letter-spacing:.08em;}
.hist-prod-item{
  background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;
}
.hist-prod-nom{font-size:.85rem;font-weight:600;}
.hist-prod-qte{font-family:'DM Mono',monospace;font-size:.88rem;font-weight:700;}
.hist-prod-qte.neg{color:var(--red);}
.hist-prod-qte.pos{color:var(--green);}
.hist-tags{display:flex;flex-wrap:wrap;gap:6px;}
.hist-tag{
  display:inline-block;padding:4px 10px;border-radius:20px;font-size:.7rem;
  font-weight:600;background:var(--surface3);border:1px solid var(--border);color:var(--text2);
}

/* ADMIN AJUSTEMENT */
.adj-grid{
  display:grid;grid-template-columns:2fr 1fr 1.5fr auto;gap:10px;align-items:center;
  background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:12px;margin-bottom:8px;
}
.adj-nom{font-weight:600;font-size:.9rem;}
.adj-qte{font-family:'DM Mono',monospace;font-weight:700;color:var(--text2);font-size:.9rem;}
.adj-input{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface3);color:var(--text);font-size:.9rem;font-weight:600;
  font-family:'DM Mono',monospace;
}
.adj-input:focus{outline:none;border-color:var(--accent);}
.btn-adj-ok{
  padding:9px 18px;border:none;border-radius:var(--radius-sm);cursor:pointer;
  background:var(--accent);color:#fff;font-size:.85rem;font-weight:700;
  font-family:'DM Sans',sans-serif;transition:opacity .2s;
}
.btn-adj-ok:hover{opacity:.85;}

/* MODAL AJUSTEMENT */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.75);z-index:1000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;padding:20px;
}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);
  transform:scale(.95);transition:transform .2s;
}
.modal-overlay.show .modal-box{transform:scale(1);}
.modal-title{font-size:1.1rem;font-weight:700;margin-bottom:6px;}
.modal-sub{font-size:.85rem;color:var(--text2);margin-bottom:18px;}
.modal-input{
  width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text);font-size:1.2rem;font-weight:700;
  font-family:'DM Mono',monospace;text-align:center;margin-bottom:18px;
}
.modal-input:focus{outline:none;border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;}
.btn-modal-cancel{
  flex:1;padding:13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:transparent;color:var(--text2);font-size:.9rem;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;
}
.btn-modal-cancel:hover{border-color:var(--red);color:var(--red);}
.btn-modal-ok{
  flex:1;padding:13px;border:none;border-radius:var(--radius-sm);cursor:pointer;
  background:var(--accent);color:#fff;font-size:.9rem;font-weight:700;
  font-family:'DM Sans',sans-serif;transition:opacity .2s;
}
.btn-modal-ok:hover{opacity:.85;}

/* UNSAVED STATUS */
#unsaved-status{
  position:fixed;bottom:20px;right:20px;z-index:90;
  background:var(--yellow);color:#000;border-radius:var(--radius-sm);
  padding:12px 18px;font-size:.85rem;font-weight:700;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s;display:flex;align-items:center;gap:8px;
}
#unsaved-status.show{opacity:1;pointer-events:all;}
#unsaved-status svg{width:18px;height:18px;}

/* CHANTIER BANNER */
#chantier-banner{
  background:linear-gradient(135deg,rgba(79,127,255,.15),rgba(123,94,167,.15));
  border:1.5px solid rgba(79,127,255,.3);border-radius:var(--radius-sm);
  padding:14px;margin-bottom:16px;display:none;align-items:center;gap:12px;
}
#chantier-banner.show{display:flex;}
#chantier-banner-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#7b5ea7);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;
}
#chantier-banner-text{flex:1;}
#chantier-banner-text p{font-size:.82rem;color:var(--text2);margin-bottom:4px;}
#chantier-banner-text strong{font-size:.95rem;color:var(--text);font-weight:700;}
#btn-reprendre-chantier{
  padding:9px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--accent);
  background:rgba(79,127,255,.1);color:var(--accent);font-size:.85rem;font-weight:700;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap;
}
#btn-reprendre-chantier:hover{background:rgba(79,127,255,.2);}

/* TOAST */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 20px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;
}
.toast.show{opacity:1;pointer-events:all;}
.toast.toast-ok{background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green);}
.toast.toast-purple{background:rgba(168,85,247,.15);border-color:var(--purple);color:var(--purple);}
.toast.toast-err{background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red);}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px;}
.stat-box{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:16px;position:relative;overflow:hidden;
}
.stat-box::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:3px;
}
.stat-box.purple::before{background:var(--purple);}
.stat-box.green::before{background:var(--green);}
.stat-box.yellow::before{background:var(--yellow);}
.stat-box.red::before{background:var(--red);}
.stat-label{font-size:.72rem;color:var(--text3);text-transform:uppercase;font-weight:700;letter-spacing:.08em;margin-bottom:8px;}
.stat-value{font-size:1.8rem;font-weight:700;font-family:'DM Mono',monospace;}

<script>
/* ══════════════════════════════════════
   DONNÉES INITIALES
══════════════════════════════════════ */
const STOCK_INITIAL=[
  {nom:'Asept 90 (5L)',qte:20,unite:'L'},
  {nom:'Bindan (5L)',qte:18,unite:'L'},
  {nom:'Brosses',qte:25,unite:'pcs'},
  {nom:'Éponges',qte:50,unite:'pcs'},
  {nom:'Gants jetables',qte:100,unite:'paires'},
  {nom:'Lingettes désinfectantes',qte:30,unite:'paquets'},
  {nom:'Sacs poubelle 50L',qte:40,unite:'rouleaux'},
  {nom:'Serpillières',qte:15,unite:'pcs'},
  {nom:'Spray vitres (750ml)',qte:12,unite:'bouteilles'},
  {nom:'WC Net (750ml)',qte:10,unite:'bouteilles'}
];

const USERS={
  'Jerome':{pin:'1234',isAdmin:false},
  'Kevin':{pin:'5678',isAdmin:false},
  'Quentin':{pin:'9012',isAdmin:false},
  'Chef':{pin:'0000',isAdmin:true}
};

/* ══════════════════════════════════════
   ÉTAT GLOBAL
══════════════════════════════════════ */
var PRODUITS=[];
var utilisations=[];
var achats=[];
var currentUser='';
var isAdmin=false;
var pin='';
var adjTarget=null;
var utilProdIdx=0;
var achatProdIdx=0;

/* ══════════════════════════════════════
   STOCKAGE PARTAGÉ
══════════════════════════════════════ */
async function loadSharedData(){
  try {
    // Charger les stocks
    const stocksData = await window.storage.get('stocks', true);
    if(stocksData && stocksData.value){
      PRODUITS = JSON.parse(stocksData.value);
    } else {
      PRODUITS = JSON.parse(JSON.stringify(STOCK_INITIAL));
      await saveStocks();
    }

    // Charger les utilisations
    const utilData = await window.storage.get('utilisations', true);
    if(utilData && utilData.value){
      utilisations = JSON.parse(utilData.value);
    }

    // Charger les achats
    const achatData = await window.storage.get('achats', true);
    if(achatData && achatData.value){
      achats = JSON.parse(achatData.value);
    }

    updateSyncStatus(true);
  } catch(err) {
    console.error('Erreur de chargement:', err);
    // Fallback sur localStorage si window.storage échoue
    PRODUITS = localStorage.getItem('sp_stocks') ? JSON.parse(localStorage.getItem('sp_stocks')) : JSON.parse(JSON.stringify(STOCK_INITIAL));
    utilisations = localStorage.getItem('sp_util') ? JSON.parse(localStorage.getItem('sp_util')) : [];
    achats = localStorage.getItem('sp_achats') ? JSON.parse(localStorage.getItem('sp_achats')) : [];
    updateSyncStatus(false);
  }
}

async function saveStocks(){
  try {
    await window.storage.set('stocks', JSON.stringify(PRODUITS), true);
    updateSyncStatus(true);
  } catch(err) {
    console.error('Erreur de sauvegarde stocks:', err);
    localStorage.setItem('sp_stocks', JSON.stringify(PRODUITS));
    updateSyncStatus(false);
  }
}

async function saveUtilisations(){
  try {
    await window.storage.set('utilisations', JSON.stringify(utilisations), true);
    updateSyncStatus(true);
  } catch(err) {
    console.error('Erreur de sauvegarde utilisations:', err);
    localStorage.setItem('sp_util', JSON.stringify(utilisations));
    updateSyncStatus(false);
  }
}

async function saveAchats(){
  try {
    await window.storage.set('achats', JSON.stringify(achats), true);
    updateSyncStatus(true);
  } catch(err) {
    console.error('Erreur de sauvegarde achats:', err);
    localStorage.setItem('sp_achats', JSON.stringify(achats));
    updateSyncStatus(false);
  }
}

function updateSyncStatus(synced){
  const status = document.getElementById('sync-status');
  if(synced){
    status.className = 'sync-status synced';
    status.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>Synchronisé';
  } else {
    status.className = 'sync-status';
    status.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Local seulement';
  }
}

/* ══════════════════════════════════════
   LOGIN
══════════════════════════════════════ */
function addPin(d){
  if(pin.length<4){
    pin+=d;
    updatePinDots();
    if(pin.length===4){
      setTimeout(checkPin,200);
    }
  }
}
function delPin(){
  if(pin.length>0){
    pin=pin.slice(0,-1);
    updatePinDots();
  }
}
function clearPin(){
  pin='';
  updatePinDots();
  document.getElementById('pin-err').textContent='';
}
function updatePinDots(){
  var dots=document.querySelectorAll('.pin-dot');
  dots.forEach(function(d,i){
    d.className=i<pin.length?'pin-dot filled':'pin-dot';
  });
}
function checkPin(){
  var u=document.getElementById('login-user').value;
  if(!u){document.getElementById('pin-err').textContent='Sélectionnez un nom.';clearPin();return;}
  if(USERS[u]&&USERS[u].pin===pin){
    currentUser=u;
    isAdmin=USERS[u].isAdmin;
    document.getElementById('screen-login').style.display='none';
    document.getElementById('screen-app').style.display='flex';
    document.getElementById('topbar-name').textContent=u;
    if(isAdmin){
      document.getElementById('topbar-badge').style.display='inline-flex';
      document.getElementById('nav-admin').style.display='flex';
    }
    init();
  }else{
    document.getElementById('pin-err').textContent='❌ Code incorrect.';
    clearPin();
  }
}
function connect(){
  if(pin.length===4){
    checkPin();
  }else{
    document.getElementById('pin-err').textContent='Entrez un code à 4 chiffres.';
  }
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
async function init(){
  await loadSharedData();
  document.getElementById('u-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('a-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('a-resp').value=currentUser;
  renderDash();
  addUtilProd();
  addAchatProd();
  showChantierBanner();
}

/* ══════════════════════════════════════
   NAVIGATION
══════════════════════════════════════ */
function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('tab-'+t).classList.add('active');
  event.target.closest('.nav-btn').classList.add('active');
  if(t==='dash'){renderDash();}
  if(t==='stock'){renderStock();}
  if(t==='hist'){renderHist();}
  if(t==='admin'&&isAdmin){renderAdminAdj();}
  if(t==='util'){showChantierBanner();}
}
function logout(){
  if(_hasUnsaved&&!confirm('Vous avez une saisie en cours. Quitter sans enregistrer ?'))return;
  currentUser='';isAdmin=false;pin='';clearUnsaved();
  document.getElementById('screen-app').style.display='none';
  document.getElementById('screen-login').style.display='flex';
  document.getElementById('login-user').value='';
  document.getElementById('topbar-badge').style.display='none';
  document.getElementById('nav-admin').style.display='none';
  clearPin();
}

/* ══════════════════════════════════════
   DASHBOARD
══════════════════════════════════════ */
function renderDash(){
  var totalUtil=0,totalAchat=0;
  utilisations.forEach(function(e){e.produits.forEach(function(p){totalUtil+=p.qte;});});
  achats.forEach(function(e){e.produits.forEach(function(p){totalAchat+=p.qte;});});
  var alertes=PRODUITS.filter(function(p){return p.qte<=0||p.qte/STOCK_INITIAL.find(function(s){return s.nom===p.nom;}).qte<=0.2;}).length;
  
  var stats='<div class="stat-box purple"><div class="stat-label">Utilisations</div><div class="stat-value">'+utilisations.length+'</div></div>';
  stats+='<div class="stat-box green"><div class="stat-label">Achats</div><div class="stat-value">'+achats.length+'</div></div>';
  stats+='<div class="stat-box yellow"><div class="stat-label">Total utilisé</div><div class="stat-value">'+Math.round(totalUtil*10)/10+'</div></div>';
  stats+='<div class="stat-box red"><div class="stat-label">Alertes stock</div><div class="stat-value">'+alertes+'</div></div>';
  document.getElementById('stats-grid').innerHTML=stats;
  
  var content='<p style="color:var(--text2);line-height:1.6;">Bienvenue '+currentUser+'. Consultez les stocks, enregistrez vos utilisations et achats, et exportez l\'historique en Excel.</p>';
  document.getElementById('dash-content').innerHTML=content;
  
  document.getElementById('badge-util').style.display=alertes>0?'inline':'none';
}

function renderProdOpts(prefix, idx, searchId){
  var search=document.getElementById(searchId)?document.getElementById(searchId).value.toLowerCase():'';
  var opts='<option value="">— Choisir un produit —</option>';
  PRODUITS.forEach(function(p,i){

    +'</div>'
    +'<div class="qte-wrap">'
    +'<input type="number" class="qte-input" id="u-qte-'+id+'" min="0.1" step="0.1" placeholder="0" oninput="markUnsaved();"/>'

    +'</div>'
    +'</div>'

}
function updateUtilOpts(id){
  var searchId='u-search-'+id;
  var selId='u-prod-'+id;
  document.getElementById(selId).innerHTML=renderProdOpts('u',id,searchId);
}
function rmUtilProd(id){
  document.getElementById('u-block-'+id).remove();
  markUnsaved();
}
function toggleDiversFields(){
  var isDivers=document.getElementById('u-type').value==='divers';
  document.getElementById('divers-fields').style.display=isDivers?'block':'none';
}
async function saveUtil(){
  var date=document.getElementById('u-date').value;
  var chantier=document.getElementById('u-chantier').value.trim();
  var type=document.getElementById('u-type').value;
  var motif=document.getElementById('u-motif').value.trim();
  var valeur=parseFloat(document.getElementById('u-valeur').value);
  
  if(!date){toast('Date requise.','err');return;}
  if(type==='chantier'&&!chantier){toast('Chantier requis.','err');return;}
  if(type==='divers'&&!motif){toast('Motif requis pour divers.','err');return;}
  
  var prods=[];
  var blocks=document.querySelectorAll('#util-prods .prod-block');
  var hasError=false;
  blocks.forEach(function(b){
    b.classList.remove('has-error');
    var id=b.id.replace('u-block-','');
    var pidx=document.getElementById('u-prod-'+id).value;
    var qte=parseFloat(document.getElementById('u-qte-'+id).value);
    if(pidx===''||isNaN(qte)||qte<=0){
      b.classList.add('has-error');
      hasError=true;
    }else{
      var p=PRODUITS[parseInt(pidx)];
      prods.push({nom:p.nom,qte:qte,unite:p.unite});
      PRODUITS[parseInt(pidx)].qte=Math.round((p.qte-qte)*100)/100;
    }
  });
  if(hasError){toast('Corrigez les produits en rouge.','err');return;}
  if(prods.length===0){toast('Ajoutez au moins un produit.','err');return;}
  
  var entry={date:date,ouvrier:currentUser,produits:prods,ts:new Date().toISOString(),type:type};
  if(type==='chantier'){
    entry.chantier=chantier;
    saveLastChantier(chantier);
  }else{
    entry.motif=motif;
    if(!isNaN(valeur)&&valeur>0) entry.valeur=valeur;
  }
  utilisations.push(entry);
  
  await saveStocks();
  await saveUtilisations();
  
  toast('✅ Utilisation enregistrée !','ok');
  document.getElementById('u-chantier').value='';
  document.getElementById('u-motif').value='';
  document.getElementById('u-valeur').value='';
  document.getElementById('u-type').value='chantier';
  toggleDiversFields();
  document.getElementById('util-prods').innerHTML='';
  utilProdIdx=0;
  addUtilProd();
  clearUnsaved();
  renderDash();
}

async function saveAchat(){
  var date=document.getElementById('a-date').value;
  var resp=document.getElementById('a-resp').value.trim();
  if(!date||!resp){toast('Date et responsable requis.','err');return;}
  
  var prods=[];
  var blocks=document.querySelectorAll('#achat-prods .prod-block');
  var hasError=false;
  blocks.forEach(function(b){
    b.classList.remove('has-error');
    var id=b.id.replace('a-block-','');
    var pidx=document.getElementById('a-prod-'+id).value;
    var qte=parseFloat(document.getElementById('a-qte-'+id).value);
    if(pidx===''||isNaN(qte)||qte<=0){
      b.classList.add('has-error');
      hasError=true;
    }else{
      var p=PRODUITS[parseInt(pidx)];
      prods.push({nom:p.nom,qte:qte,unite:p.unite});
      PRODUITS[parseInt(pidx)].qte=Math.round((p.qte+qte)*100)/100;
    }
  });
  if(hasError){toast('Corrigez les produits en rouge.','err');return;}
  if(prods.length===0){toast('Ajoutez au moins un produit.','err');return;}
  
  achats.push({date:date,responsable:resp,produits:prods,ts:new Date().toISOString()});
  
  await saveStocks();
  await saveAchats();
  
  toast('✅ Achat enregistré !','ok');
  document.getElementById('achat-prods').innerHTML='';
  achatProdIdx=0;
  addAchatProd();
  clearUnsaved();
  renderDash();
}

/* ══════════════════════════════════════
   STOCKS
══════════════════════════════════════ */
function renderStock(){
  var h='';
  PRODUITS.forEach(function(p,i){
    var init=STOCK_INITIAL.find(function(s){return s.nom===p.nom;});
    var pct=init?p.qte/init.qte:0;
    var status='ok',statusTxt='OK';
    if(p.qte<=0){status='zero';statusTxt='Épuisé';}
    else if(pct<=0.2){status='crit';statusTxt='Critique';}
    else if(pct<=0.5){status='low';statusTxt='Faible';}
    h+='<tr onclick="'+(isAdmin?'openAdj('+i+')':'')+'" style="'+(isAdmin?'':'cursor:default;')+'">'
      +'<td class="nom-col">'+p.nom+'</td>'
      +'<td class="qte-col">'+p.qte+' '+p.unite+'</td>'
      +'<td class="status-col"><span class="stock-pill '+status+'">'+statusTxt+'</span></td>'
      +'</tr>';
  });
  document.getElementById('stock-tbody').innerHTML=h;
}

/* ══════════════════════════════════════
   HISTORIQUE
══════════════════════════════════════ */
function renderHist(){
  var all=[];
  utilisations.forEach(function(e){all.push({...e,_type:'util'});});
  achats.forEach(function(e){all.push({...e,_type:'achat'});});
  all.sort(function(a,b){return a.ts>b.ts?-1:1;});
  
  var h='';
  all.forEach(function(e){
    var type=e._type;
    var typeClass=type==='achat'?'type-achat':(e.type==='divers'?'type-divers':'');
    var typeLabel=type==='achat'?'Achat':(e.type==='divers'?'Divers':'Utilisation');
    var typeLabelClass=type==='achat'?'achat':(e.type==='divers'?'divers':'util');
    
    h+='<div class="hist-card '+typeClass+'">'
      +'<div class="hist-header">'
      +'<span class="hist-type '+typeLabelClass+'">'+typeLabel+'</span>'
      +'<span class="hist-date">'+fmtD(e.date)+'</span>'
      +'</div>'
      +'<div class="hist-info">';
    
    if(type==='util'){
      if(e.type==='chantier'){
        h+='<div class="hist-row"><strong>Chantier:</strong> '+e.chantier+'</div>';
      }else{
        h+='<div class="hist-row"><strong>Motif:</strong> '+e.motif+'</div>';
        if(e.valeur!=null){
          h+='<div class="hist-row"><strong>Valeur:</strong> '+e.valeur.toFixed(2)+' €</div>';
        }
      }
      h+='<div class="hist-row"><strong>Ouvrier:</strong> '+e.ouvrier+'</div>';
    }else{
      h+='<div class="hist-row"><strong>Responsable:</strong> '+e.responsable+'</div>';
    }
    
    h+='</div>'
      +'<div class="hist-produits">'
      +'<div class="hist-produits-title">Produits</div>';
    
    e.produits.forEach(function(p){
      var sign=type==='achat'?'+':'-';
      var qteClass=type==='achat'?'pos':'neg';
      h+='<div class="hist-prod-item">'
        +'<span class="hist-prod-nom">'+p.nom+'</span>'
        +'<span class="hist-prod-qte '+qteClass+'">'+sign+p.qte+' '+p.unite+'</span>'
        +'</div>';
    });
    
    h+='</div>';
    
    var tags='';
    if(type==='util'&&e.type==='divers'){
      tags+='<span class="hist-tag">💼 Divers</span>';
    }
    if(type==='achat'){
      tags+='<span class="hist-tag">🛒 Achat</span>';
    }
    h+='<div class="hist-tags">'+tags+'</div>'
      +'</div>';
  });
  document.getElementById('hist-list').innerHTML=h;
}

function renderAdminAdj(){
  var h='';
  PRODUITS.forEach(function(p,i){

      +'<div class="adj-nom">'+p.nom+'</div>'

async function adjStock(i){
  var val=parseFloat(document.getElementById('adjv-'+i).value);
  if(isNaN(val)||val<0){toast('Valeur invalide.','err');return;}
  var old=PRODUITS[i].qte;
  PRODUITS[i].qte=Math.round(val*100)/100;
  await saveStocks();
  toast('✅ Stock mis à jour : '+PRODUITS[i].nom+' → '+PRODUITS[i].qte,'ok');
  renderAdminAdj();
}

/* Modal ajustement rapide depuis table stock */
function openAdj(i){
  adjTarget={idx:i,nom:PRODUITS[i].nom};
  document.getElementById('modal-title').textContent='Ajuster : '+PRODUITS[i].nom;
  document.getElementById('modal-sub').textContent='Stock actuel : '+PRODUITS[i].qte;

function closeModal(){document.getElementById('modal-adj').className='modal-overlay';}
async function confirmerAjustement(){
  if(!adjTarget)return;
  var val=parseFloat(document.getElementById('modal-input').value);
  if(isNaN(val)||val<0){toast('Valeur invalide.','err');return;}
  PRODUITS[adjTarget.idx].qte=Math.round(val*100)/100;
  await saveStocks();
  toast('✅ '+adjTarget.nom+' → '+PRODUITS[adjTarget.idx].qte,'ok');
  closeModal(); adjTarget=null;
  renderStock();
}

/* ══════════════════════════════════════
   RESET
══════════════════════════════════════ */
async function resetAllData(){
  if(!confirm('⚠️ Supprimer TOUTES les données (historique + stocks) ? Cette action est irréversible.'))return;
  
  try {
    await window.storage.delete('stocks', true);
    await window.storage.delete('utilisations', true);
    await window.storage.delete('achats', true);
  } catch(err) {
    console.error('Erreur suppression:', err);
  }
  
  // Fallback localStorage
  localStorage.removeItem('sp_stocks');
  localStorage.removeItem('sp_util');
  localStorage.removeItem('sp_achats');
  
  PRODUITS=JSON.parse(JSON.stringify(STOCK_INITIAL));
  utilisations=[]; achats=[];
  
  await saveStocks();
  await saveUtilisations();
  await saveAchats();
  
  toast('Données réinitialisées.','ok');
  renderDash();
}

/* ══════════════════════════════════════
   EXPORT XLSX
══════════════════════════════════════ */
function exportXLSX(){
  if(!utilisations.length&&!achats.length){toast('Aucune donnée à exporter.','err');return;}
  var wb=XLSX.utils.book_new();
  var hist=[['Date','Type','Chantier / Motif','Ouvrier','Produit','Quantité','Valeur (€)','Enregistré le']];
  var rows=[];
  utilisations.forEach(function(e){
    var isDiv=(e.type==='divers');
    var ref=isDiv?(e.motif||'Divers'):e.chantier;
    e.produits.forEach(function(p){
      rows.push([fmtD(e.date), isDiv?'Divers':'Utilisation', ref, e.ouvrier, p.nom, -p.qte, isDiv&&e.valeur!=null?e.valeur:'', e.ts]);
    });
  });
  achats.forEach(function(e){
    e.produits.forEach(function(p){
      rows.push([fmtD(e.date),'Achat','',e.responsable,p.nom,+p.qte,'',e.ts]);
    });
  });
  rows.sort(function(a,b){return a[7]<b[7]?-1:1;});
  rows.forEach(function(r){hist.push(r);});
  var ws1=XLSX.utils.aoa_to_sheet(hist);
  ws1['!cols']=[{wch:12},{wch:13},{wch:25},{wch:18},{wch:38},{wch:12},{wch:12},{wch:22}];
  XLSX.utils.book_append_sheet(wb,ws1,'Historique');

  var tU={},tA={};
  utilisations.forEach(function(e){e.produits.forEach(function(p){tU[p.nom]=(tU[p.nom]||0)+p.qte;});});
  achats.forEach(function(e){e.produits.forEach(function(p){tA[p.nom]=(tA[p.nom]||0)+p.qte;});});
  var s2=[['Produit','Stock initial','Acheté','Utilisé','Stock final','Statut']];
  STOCK_INITIAL.forEach(function(si){
    var ach=tA[si.nom]||0,util=tU[si.nom]||0,fin=Math.round((si.qte+ach-util)*100)/100;
    var status=fin<=0?'Épuisé':fin/si.qte<=0.2?'Critique':fin/si.qte<=0.5?'Faible':'OK';
    s2.push([si.nom,si.qte,ach,util,fin,status]);
  });
  var ws2=XLSX.utils.aoa_to_sheet(s2);
  ws2['!cols']=[{wch:38},{wch:14},{wch:12},{wch:12},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws2,'Stocks');
  XLSX.writeFile(wb,'StockPro_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('📥 Export téléchargé !','ok');
}

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
function fmtD(d){if(!d)return'';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
var _toastT;
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+(type==='ok'?'toast-ok':type==='purple'?'toast-purple':'toast-err');
  t.classList.add('show');
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){t.classList.remove('show');},2800);
}

/* ══════════════════════════════════════
   CHANTIER DU JOUR
══════════════════════════════════════ */
function getLastChantier(){
  return localStorage.getItem('sp_last_chantier_'+currentUser)||'';
}
function saveLastChantier(nom){
  if(nom) localStorage.setItem('sp_last_chantier_'+currentUser, nom);
}
function showChantierBanner(){
  var last=getLastChantier();
  var banner=document.getElementById('chantier-banner');
  var nomEl=document.getElementById('chantier-banner-nom');
  if(last && !document.getElementById('u-chantier').value.trim()){
    nomEl.textContent=last;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}
function reprendreChantier(){
  var last=getLastChantier();
  if(last){
    document.getElementById('u-chantier').value=last;
    document.getElementById('chantier-banner').classList.remove('show');
    markUnsaved();
    toast('✅ Chantier "'+last+'" repris !','ok');
  }
}

/* ══════════════════════════════════════
   UNSAVED CHANGES GUARD
══════════════════════════════════════ */
var _hasUnsaved=false;
function markUnsaved(){
  _hasUnsaved=true;
  document.getElementById('unsaved-status').classList.add('show');
}
function clearUnsaved(){
  _hasUnsaved=false;
  document.getElementById('unsaved-status').classList.remove('show');
}
window.addEventListener('beforeunload',function(e){
  if(_hasUnsaved){
    e.preventDefault();
    e.returnValue='Vous avez une saisie en cours. Quitter sans enregistrer ?';
    return e.returnValue;
  }
});
